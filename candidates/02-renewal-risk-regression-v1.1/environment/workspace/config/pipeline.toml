# renewal_risk training pipeline configuration.
# Paths are relative to the workspace root (the parent of this config/ directory).

[paths]
warehouse_db = "data/warehouse.db"
artifacts_dir = "artifacts"
reports_dir = "reports"

[run]
# Default training run date. The scheduler passes --as-of for each quarterly retrain.
as_of = "2026-08-15"

[examples]
horizon_days = 90          # renewals are scored 90 days before the renewal date
label_grace_days = 30      # outcome must be settled for 30 days before a renewal is used
eval_window_days = 270     # most recent 9 months of settled renewals are held out
train_window_days = 1095   # preceding 3 years are used for training

[model]
C = 0.5
class_weight = "balanced"  # v2.4: recall on churners (RA-DS-311)
winsor_lower = 0.01
winsor_upper = 0.99
max_iter = 2000
calibration_bins = 10
