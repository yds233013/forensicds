; cobalt-metering pipeline configuration (paths relative to the repository root)
[paths]
landing = raw/landing
customers = config/customers.csv
rate_cards = config/rate_cards.csv
out = out

[collector]
; dedupe store retention for collector redeliveries (platform default)
redelivery_ttl_hours = 24

[statements]
; statement close, in hours after the end of the calendar month (see ops/billing_close_runbook.md)
close_hours_after_month_end = 72
